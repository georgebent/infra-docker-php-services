version: '3.7'
services:
 postgres:
  container_name: ${NAME}_postgres
  image: postgres:15.3-alpine
  restart: on-failure
  environment:
   POSTGRES_USER: ${POSTGRES_USER}
   POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  ports:
   - '5432:5432'
  volumes:
   - ./.data/postgresql:/var/lib/postgresql/data
  networks:
   default:
    ipv4_address: ${POSTGRES_IP}
 php:
  container_name: ${NAME}_php
  build:
   context: ./etc/php
  volumes:
   - "./../services/:/srv/src/"
   - "./etc/php/config/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini"
   - "./etc/php/config/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini"
  networks:
   default:
    ipv4_address: ${PHP_IP}
  extra_hosts:
   - "host.docker.internal:host-gateway"
 php71:
  container_name: ${NAME}_php71
  build:
   context: ./etc/php71
  volumes:
   - "./../services/:/srv/src/"
  networks:
   default:
    ipv4_address: ${PHP71_IP}
 php83:
  container_name: ${NAME}_php83
  build:
   context: ./etc/php83
  volumes:
   - "./../services/:/srv/src/"
   - "./etc/php83/config/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini"
   - "./etc/php/config/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini"
   - "./etc/php/config/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini"
  networks:
   default:
    ipv4_address: ${PHP83_IP}
  extra_hosts:
   - "host.docker.internal:host-gateway"
 mysql:
  container_name: ${NAME}_mysql
  image: mysql:5.7
  restart: on-failure
  environment:
   MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
  ports:
   - '3307:3306'
  volumes:
   - ./.data/mysql:/var/lib/mysql
  networks:
   default:
    ipv4_address: ${MYSQL_IP}
 mongo:
  container_name: ${NAME}_mongo
  image: mongo:7
  restart: on-failure
  environment:
   MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
   MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
  ports:
   - '27017:27017'
  volumes:
   - /data/mongo/data:/data/db
  networks:
   default:
    ipv4_address: ${MONGO_IP}
 nginx:
  container_name: ${NAME}_nginx
  depends_on:
   - php
   - php71
   - php83
  image: nginx:1.28.2-alpine
  ports:
   - '8080:80'
  volumes:
   - "./.data/nginx/logs:/var/log/nginx"
   - "./etc/nginx/:/etc/nginx/conf.d/"
   - "./../services/:/srv/src/"
  networks:
   default:
    ipv4_address: ${NGINX_IP}
 mailpit:
  container_name: ${NAME}_mailpit
  image: axllent/mailpit:latest
  restart: on-failure
  environment:
   MP_MAX_MESSAGES: 5000
   MP_DATABASE: /data/mailpit.db
  ports:
   - '1025:1025'
   - '8025:8025'
  volumes:
   - ./.data/mailpit:/data
  networks:
   default:
    ipv4_address: ${MAILPIT_IP}
networks:
 default:
  driver: bridge
  ipam:
   driver: default
   config:
    - subnet: ${SUBNET}
